<div class="login-screen">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6l-8-4Z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="login-logo-text serif">ADRA</div>
    </div>
    <p class="login-sub">Sistema de Gestão · Araraquara</p>

    <div class="field">
      <label for="login-email">E-mail institucional</label>
      <input
        class="input"
        id="login-email"
        type="email"
        placeholder="coordenador@adra.org.br"
        [(ngModel)]="email"
        autocomplete="username">
    </div>

    <div class="field">
      <label for="login-pass">Senha</label>
      <input
        class="input"
        id="login-pass"
        type="password"
        placeholder="••••••••"
        [(ngModel)]="senha"
        autocomplete="current-password">
    </div>

    <div class="field">
      <label for="login-profile-select">Perfil de acesso (simulação)</label>
      <select class="select" id="login-profile-select" [(ngModel)]="perfilSelecionado">
        @for (perfil of perfis; track perfil) {
          <option [value]="perfil">{{ perfil }}</option>
        }
      </select>
    </div>

    <button class="btn btn-block" (click)="entrar()">Entrar</button>

    <p class="login-note">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <path d="M12 16v-4M12 8h.01"/>
      </svg>
      <span>Em produção o perfil é detectado automaticamente pelas credenciais (RBAC). A seleção acima existe apenas para demonstração do protótipo.</span>
    </p>
    <p class="login-foot">Protótipo acadêmico — IFSP Campus Araraquara</p>
  </div>
</div>
