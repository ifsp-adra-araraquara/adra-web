<app-auth-shell titulo="Sistema de Gestão" descricao="Gestão integrada de oficinas, turmas, frequência e atendimento social da ADRA Araraquara.">
  <form class="login-form" (ngSubmit)="entrar()">
    <h1 class="login-sub">Acesse sua conta</h1>
    <p class="login-desc">Informe seu e-mail e senha institucionais para entrar no painel de gestão.</p>

    <app-input
      label="E-mail institucional"
      type="email"
      name="email"
      placeholder="coordenador@adra.org.br"
      autocomplete="username"
      [(ngModel)]="email"
    />

    <app-input
      label="Senha"
      type="password"
      name="senha"
      placeholder="••••••••"
      autocomplete="current-password"
      [(ngModel)]="senha"
    />

    @if (erro()) {
    <p class="login-erro" role="alert">{{ erro() }}</p>
    }

    <app-button type="submit" size="lg" [block]="true" [loading]="carregando()">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </app-button>

    <p class="login-foot" style="margin-top: 14px;">
      <a routerLink="/esqueci-senha">Esqueceu sua senha?</a>
    </p>
  </form>
</app-auth-shell>
