<div class="login-screen">
  <form class="login-card" (ngSubmit)="entrar()">
    <div class="login-brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2 4 6v6c0 5 3.4 8.5 8 10 4.6-1.5 8-5 8-10V6l-8-4Z"/>
          <path d="m9 12 2 2 4-4"/>
        </svg>
      </div>
      <div class="login-logo-text serif">ADRA</div>
    </div>
    <p class="login-sub">Sistema de Gestão · Araraquara</p>

    <div class="field">
      <label for="login-email">E-mail institucional</label>
      <input
        class="input"
        id="login-email"
        name="email"
        type="email"
        placeholder="coordenador@adra.org.br"
        [(ngModel)]="email"
        autocomplete="username">
    </div>

    <div class="field">
      <label for="login-pass">Senha</label>
      <input
        class="input"
        id="login-pass"
        name="senha"
        type="password"
        placeholder="••••••••"
        [(ngModel)]="senha"
        autocomplete="current-password">
    </div>

    @if (erro()) {
      <p class="login-erro" role="alert">{{ erro() }}</p>
    }

    <button type="submit" class="btn btn-block" [disabled]="carregando()">
      {{ carregando() ? 'Entrando...' : 'Entrar' }}
    </button>
    <p class="login-foot">Protótipo acadêmico — IFSP Campus Araraquara</p>
  </form>
</div>
