<div>
  <div class="card-head" style="border: none; padding: 0 0 18px;">
    <h1>Responsáveis</h1>
    <div class="right">
      <app-button (click)="abrirNovo()">Novo responsável</app-button>
    </div>
  </div>

  @if (carregando()) {
    <div class="muted">Carregando...</div>
  }

  @if (!carregando()) {
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Telefone</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            @for (responsavel of responsaveis(); track responsavel.responsavelId) {
              <tr>
                <td class="cell-name">{{ responsavel.nomeCompleto }}</td>
                <td>{{ responsavel.cpf }}</td>
                <td>{{ responsavel.telefone || '-' }}</td>
                <td>
                  <div class="t-actions">
                    <button type="button" (click)="abrirEdicao(responsavel)">Editar</button>
                  </div>
                </td>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  }

  <app-modal
    [(open)]="mostrarModal"
    [title]="responsavelSelecionado() ? 'Editar responsável' : 'Novo responsável'"
    (closed)="aoCancelar()"
  >
    @if (mostrarModal()) {
      <app-responsavel-form
        [responsavelParaEditar]="responsavelSelecionado()"
        (salvo)="aoSalvar()"
        (cancelado)="aoCancelar()"
      />
    }
  </app-modal>
</div>
