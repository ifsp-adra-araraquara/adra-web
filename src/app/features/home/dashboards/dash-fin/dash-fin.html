<div class="grid g-stats">
  <app-stat-card iconClass="ico-green" value="2" label="Projetos ativos" trend="vigência 2025" trendClass="muted">
    <app-icon name="folder" icon />
  </app-stat-card>

  <app-stat-card iconClass="ico-blue" value="7" label="Exportações geradas" trend="▲ 2 este mês" trendClass="t-up">
    <app-icon name="download" icon />
  </app-stat-card>
</div>

<div class="card mt">
  <div class="card-head"><h3>Exportações recentes</h3></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Arquivo</th><th>Período</th><th>Projeto</th><th>Formato</th><th>Data</th></tr>
      </thead>
      <tbody>
        @for (e of exportacoes; track e.arquivo) {
          <tr>
            <td class="cell-name">{{ e.arquivo }}</td>
            <td>{{ e.periodo }}</td>
            <td>{{ e.projeto }}</td>
            <td><app-badge [plain]="true" [variant]="e.formato === 'PDF' ? 'red' : 'green'" [label]="e.formato" /></td>
            <td>{{ e.data }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
