<div class="grid g-stats">
  <app-stat-card iconClass="ico-teal" value="14" label="Atendimentos este mês" trend="▲ 3 vs. mês ant." trendClass="t-up">
    <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15h6M9 11h2"/></svg>
  </app-stat-card>

  <app-stat-card iconClass="ico-blue" value="9" label="Assistidos em acompanhamento" trend="na sua área" trendClass="muted">
    <svg icon viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
  </app-stat-card>
</div>

<div class="card mt">
  <div class="card-head"><h3>Atendimentos recentes</h3></div>
  <div class="card-pad">
    <div class="timeline">
      @for (a of atendimentos; track a.texto) {
        <div class="tl-item">
          <div class="tl-dot ico-teal">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          </div>
          <div class="tl-body">
            <div class="t">{{ a.texto }}</div>
            <div class="when">{{ a.quando }}</div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
