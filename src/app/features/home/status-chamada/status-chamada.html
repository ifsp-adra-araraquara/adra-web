<section class="status-chamada-page" aria-labelledby="status-chamada-titulo">
  <header class="page-header">
    <button type="button" class="btn-voltar" (click)="voltar()">
      <app-icon name="chevron-left" />
      Voltar
    </button>
    <p class="eyebrow">Pedagógico</p>
    <h1 id="status-chamada-titulo">Status das chamadas</h1>
    <p class="page-intro">
      Dias de chamada de cada grupo no período, até hoje, e se a chamada foi lançada. Feriados e dias sem atividade não entram.
    </p>
  </header>

  <section class="panel">
    <div class="panel-header">
      <div class="filtros">
        <div class="field">
          <label for="filtro-turma">Grupo</label>
          <app-select
            id="filtro-turma"
            name="turmaIdFiltro"
            [options]="turmasOpcoes()"
            placeholder="Todos os grupos"
            [(ngModel)]="turmaIdFiltro"
          />
        </div>
        <div class="field">
          <label for="filtro-inicio">De</label>
          <input id="filtro-inicio" class="input" type="date" name="dataInicioFiltro" [(ngModel)]="dataInicioFiltro" />
        </div>
        <div class="field">
          <label for="filtro-fim">Até</label>
          <input id="filtro-fim" class="input" type="date" name="dataFimFiltro" [(ngModel)]="dataFimFiltro" />
        </div>
      </div>

      <div class="resumo" role="status" aria-live="polite">
        <app-badge [status]="StatusChamada.LANCADA" [label]="totalLancadas() + ' lançada(s)'" />
        <app-badge [status]="StatusChamada.PENDENTE" [label]="totalPendentes() + ' pendente(s)'" />
      </div>
    </div>

    @if (carregando()) {
    <p class="feedback" role="status">Carregando...</p>
    } @else if (erro()) {
    <p class="feedback error" role="alert">{{ erro() }}</p>
    }

    <app-table label="Status das chamadas por grupo e dia" [columns]="colunas" [data]="chamadas()" [trackBy]="trackChamada" [pageSize]="15">
      <ng-template #rowActions let-chamada>
        <button
          type="button"
          [class.btn-icon--primary]="chamada.status === StatusChamada.PENDENTE"
          [attr.aria-label]="chamada.status === StatusChamada.PENDENTE ? 'Lançar chamada' : 'Ver chamada'"
          [appTooltip]="chamada.status === StatusChamada.PENDENTE ? 'Lançar chamada' : 'Ver chamada'"
          (click)="abrirChamada(chamada)"
        >
          <app-icon [name]="chamada.status === StatusChamada.PENDENTE ? 'check-square' : 'eye'" />
        </button>
      </ng-template>
    </app-table>
  </section>
</section>
