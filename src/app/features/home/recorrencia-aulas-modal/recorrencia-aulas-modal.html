<app-modal [open]="aberto()" title="Configurar recorrência de aulas" size="md" (closed)="fecharModal()">
  <div class="field">
    <label>Turma</label>
    <app-select [options]="turmasOpcoes()" placeholder="Selecione a turma" name="turmaId" [(ngModel)]="turmaId" />
  </div>

  <fieldset class="field">
    <legend>Dias da semana</legend>
    <div class="flex flex-wrap gap-2">
      @for (dia of diasSemanaOpcoes; track dia.value) {
        <button
          type="button"
          class="btn btn-sm"
          [class.btn-ghost]="!diasSelecionados().includes(dia.value)"
          (click)="toggleDia(dia.value)"
        >
          {{ dia.label }}
        </button>
      }
    </div>
  </fieldset>

  <div class="form-row">
    <div class="field">
      <label>Data início</label>
      <input class="input" type="date" [(ngModel)]="dataInicio" name="dataInicio" />
    </div>
    <div class="field">
      <label>Data fim</label>
      <input class="input" type="date" [(ngModel)]="dataFim" name="dataFim" />
    </div>
    <div class="field">
      <label>Horário início</label>
      <input class="input" type="time" [(ngModel)]="horarioInicio" name="horarioInicio" />
    </div>
    <div class="field">
      <label>Horário fim</label>
      <input class="input" type="time" [(ngModel)]="horarioFim" name="horarioFim" />
    </div>
  </div>

  <div class="field">
    <label>Título (opcional)</label>
    <input class="input" type="text" [(ngModel)]="titulo" name="titulo" />
  </div>
  <div class="field">
    <label>Descrição (opcional)</label>
    <textarea class="input" [(ngModel)]="descricao" name="descricao"></textarea>
  </div>

  @if (erro()) {
    <p class="feedback error" role="alert">{{ erro() }}</p>
  }
  @if (resumoGeracao()) {
    <p class="feedback success" role="status">{{ resumoGeracao() }}</p>
  }

  <ng-template #footer>
    <button type="button" class="btn btn-ghost" (click)="fecharModal()">Fechar</button>
    <button type="button" class="btn" [disabled]="!formularioValido() || gerando()" (click)="gerar()">
      {{ gerando() ? 'Gerando...' : 'Gerar aulas' }}
    </button>
  </ng-template>
</app-modal>
