<app-modal [open]="true" [title]="aula().titulo ?? aula().nomeTurma ?? 'Aula'" size="sm" (closed)="fechar.emit()">
  <p class="subtle">
    {{ aula().nomeTurma }} · {{ aula().dataAula }}
    @if (aula().horarioInicio && aula().horarioFim) { · {{ aula().horarioInicio }}–{{ aula().horarioFim }} }
  </p>

  <div class="field" style="display:flex; align-items:center; gap:8px;">
    <span class="subtle">Status atual:</span>
    <app-badge [status]="aula().statusAula" />
  </div>

  <div class="field">
    <label>Novo status</label>
    <app-select [options]="opcoesStatus" placeholder="Selecione o novo status" name="novoStatus" [(ngModel)]="novoStatus" />
  </div>

  @if (erro()) {
    <p class="feedback error" role="alert">{{ erro() }}</p>
  }

  <ng-template #footer>
    <button type="button" class="btn btn-ghost" (click)="fechar.emit()">Cancelar</button>
    <button type="button" class="btn" [disabled]="!podeSalvar()" (click)="salvarStatus()">
      {{ salvando() ? 'Salvando...' : 'Salvar' }}
    </button>
  </ng-template>
</app-modal>
