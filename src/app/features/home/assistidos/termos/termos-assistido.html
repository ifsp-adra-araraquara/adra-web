<div class="termos">
  @for (termo of termos; track termo.campo) {
    <label
      class="termo"
      [class.termo--marcado]="marcado(termo.campo)"
      [class.termo--invalido]="termo.obrigatorio && invalido() && !marcado(termo.campo)"
    >
      <input
        type="checkbox"
        [checked]="marcado(termo.campo)"
        [attr.aria-required]="termo.obrigatorio ? 'true' : null"
        (change)="alternar(termo.campo, $any($event.target).checked)"
      />
      <span>
        <b>
          {{ termo.titulo }}
          @if (termo.obrigatorio) {
            <span class="obrigatorio">(obrigatório)</span>
          }
        </b>
        <small>{{ termo.descricao }}</small>
      </span>
    </label>
  }
</div>
