<section class="grade-page" aria-labelledby="grade-titulo">
  <button type="button" class="btn-voltar" (click)="voltar()">
    <app-icon name="chevron-left" />
    Voltar
  </button>

  <header class="page-header">
    <div class="page-header-texto">
      <h1 id="grade-titulo">{{ nomeTurma() || 'Grade do mês' }}</h1>
      <p class="page-intro">Frequência do mês, como na planilha. Toque no dia para abrir a chamada daquela aula.</p>
    </div>
  </header>

  @if (turmaId(); as id) {
    <app-grade-mensal
      [turmaId]="id"
      [mes]="mes()"
      (mesChange)="mudarMes($event)"
      (abrirAula)="abrirAula($event)"
      (carregada)="nomeTurma.set($event.nomeTurma)"
    />
  } @else {
    <div class="notice notice-error" role="alert"><app-icon name="alert-circle" /><span>Turma não encontrada.</span></div>
  }
</section>
