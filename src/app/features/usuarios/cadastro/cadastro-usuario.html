<h2 class="usuarios-titulo">Cadastrar usuário</h2>

<form class="usuarios-form" [formGroup]="form" (ngSubmit)="cadastrar()">

  <app-input label="Nome completo" formControlName="nomeCompleto" [required]="true" [errorMessage]="erroNome()" />

  <app-input label="E-mail" type="email" formControlName="email" [required]="true" [errorMessage]="erroEmail()" />

  <app-input
    label="CPF"
    mask="cpf"
    formControlName="cpf"
    placeholder="000.000.000-00"
    [required]="true"
    [errorMessage]="erroCpf()"
  />

  <div class="field">
    <label for="perfil">Perfil de acesso</label>
    <app-select
      id="perfil"
      formControlName="nivelPermissao"
      [options]="perfilOptions"
    />
  </div>

  <app-input label="Cargo ou função" formControlName="cargoFuncao" />

  <app-input
    label="Telefone"
    mask="telefone"
    formControlName="telefone"
    placeholder="(16) 99999-8888"
    [errorMessage]="erroTelefone()"
  />

  @if (erro()) {
  <p class="usuarios-erro" role="alert">{{ erro() }}</p>
  }
  @if (sucesso()) {
  <p class="usuarios-sucesso" role="status">{{ sucesso() }}</p>
  }

  <app-button type="submit" [loading]="salvando()">Cadastrar</app-button>
</form>
