<h2 class="senha-titulo">Definir senha</h2>

<p class="senha-ajuda">
  Use enquanto o convite por e-mail não estiver disponível, ou quando alguém perder o acesso.
</p>

<form class="senha-form" [formGroup]="form" (ngSubmit)="definir()">

  <app-input label="E-mail do usuário" type="email" formControlName="email" [required]="true" [errorMessage]="erroEmail()" />

  <div>
    <app-input
      label="Nova senha"
      type="password"
      formControlName="novaSenha"
      autocomplete="new-password"
      [required]="true"
      [errorMessage]="erroSenha()"
    />
    <app-senha-forca [senha]="form.controls.novaSenha.value" />
  </div>

  @if (erro()) {
  <p class="senha-erro" role="alert">{{ erro() }}</p>
  }
  @if (sucesso()) {
  <p class="senha-sucesso" role="status">{{ sucesso() }}</p>
  }

  <app-button type="submit" [loading]="salvando()">Definir senha</app-button>
</form>
