<a class="pular-conteudo no-print" href="#conteudo" (click)="pularParaConteudo($event)">Pular para o conteúdo</a>

<app-sidebar [(open)]="menuOpen" [(collapsed)]="sidebarCollapsed" />

@if (menuOpen()) {
  <div class="backdrop" (click)="menuOpen.set(false)"></div>
}

<div class="main" [class.sidebar-collapsed]="sidebarCollapsed()">
  <header class="topbar">
    <button
      #menuButton
      type="button"
      class="menu-btn"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menu"
      (click)="menuOpen.set(true)">
      <app-icon name="menu" />
    </button>
    <p class="topbar-titulo">Sistema de Gestão</p>

    <div class="topbar-acoes">
      <app-notificacoes />

      @if (mostrarAjudaTour()) {
        <button
          type="button"
          class="help-btn"
          aria-label="Ver tutorial guiado"
          appTooltip="Ver tutorial"
          (click)="abrirTutorial()"
        >
          <app-icon name="help-circle" />
        </button>
      }
    </div>
  </header>

  <main #conteudo id="conteudo" class="content" tabindex="-1">
    <router-outlet />
  </main>
  <p class="sr-only no-print" aria-live="polite">{{ anuncioTela() }}</p>
</div>
