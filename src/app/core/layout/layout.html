<app-sidebar [(open)]="menuOpen" [(collapsed)]="sidebarCollapsed" />

@if (menuOpen()) {
  <div class="backdrop" (click)="menuOpen.set(false)"></div>
}

<div class="main" [class.sidebar-collapsed]="sidebarCollapsed()">
  <header class="topbar">
    <button
      #menuButton
      type="button"
      class="menu-btn"
      aria-controls="app-sidebar"
      [attr.aria-expanded]="menuOpen()"
      aria-label="Abrir menu"
      (click)="menuOpen.set(true)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <h1>Sistema de Gestão</h1>

    @if (mostrarAjudaTour()) {
      <button
        type="button"
        class="help-btn"
        aria-label="Ver tutorial guiado"
        appTooltip="Ver tutorial"
        (click)="abrirTutorial()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4" />
          <path d="M12 17h.01" />
        </svg>
      </button>
    }
  </header>

  <main class="content">
    <router-outlet />
  </main>
</div>
