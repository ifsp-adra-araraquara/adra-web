<div class="app-input-field" [class.has-error]="hasError()">
  @if (label()) {
    <label [for]="inputId()" class="app-input-label" [class.sr-only]="hideLabel()">
      {{ label() }}
      @if (required()) {
        <span class="app-input-required" aria-hidden="true">*</span>
      }
    </label>
  }

  <div class="app-input-control" [class.app-input-control--password]="type() === 'password'">
    <input
      [id]="inputId()"
      [type]="effectiveType()"
      [attr.name]="name() || null"
      [attr.placeholder]="placeholder() || null"
      [attr.autocomplete]="autocomplete() || null"
      [attr.inputmode]="inputMode()"
      [attr.maxlength]="effectiveMaxLength()"
      [attr.max]="max() || null"
      [attr.min]="min() || null"
      [disabled]="effectiveDisabled()"
      [readOnly]="readonly()"
      [required]="required()"
      [value]="displayValue()"
      [attr.aria-invalid]="hasError() ? 'true' : null"
      [attr.aria-describedby]="hasError() ? errorId() : null"
      class="app-input-control-el"
      (input)="handleInput($event)"
      (blur)="handleBlur()"
    />

    @if (type() === 'password') {
      <button
        type="button"
        class="app-input-toggle"
        [attr.aria-label]="showPassword() ? 'Ocultar senha' : 'Mostrar senha'"
        [attr.aria-pressed]="showPassword()"
        (click)="togglePasswordVisibility()"
      >
        @if (showPassword()) {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
            <line x1="1" y1="1" x2="23" y2="23" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        }
      </button>
    }
  </div>

  @if (hasError()) {
    <p class="app-input-error" [id]="errorId()" role="alert">{{ errorMessage() }}</p>
  }
</div>
