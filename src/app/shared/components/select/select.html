<select
  [id]="id() || null"
  [attr.name]="name() || null"
  [disabled]="effectiveDisabled()"
  [value]="selectedIndex()"
  [attr.aria-invalid]="invalido() ? 'true' : null"
  [attr.aria-describedby]="descritoPor() || null"
  (change)="handleChange($event)"
  (blur)="handleBlur()"
  class="select"
>
  @if (placeholder()) {
    <option value="-1" disabled>{{ placeholder() }}</option>
  }
  @for (opt of options(); track $index) {
    <option [value]="$index" [disabled]="opt.disabled ?? false">{{ opt.label }}</option>
  }
</select>
