@if (open()) {
  <div class="modal-overlay open" role="presentation" (click)="onBackdropClick()">
    <div
      class="modal"
      [class.modal-sm]="size() === 'sm'"
      [class.modal-lg]="size() === 'lg'"
      role="dialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      (click)="$event.stopPropagation()"
    >
      <div class="modal-head">
        <ng-content select="[modal-icon]"></ng-content>
        <div class="modal-title">
          <h2 [id]="titleId">{{ title() }}</h2>
          @if (subtitle()) {
            <p class="cell-sub">{{ subtitle() }}</p>
          }
        </div>
        <ng-content select="[modal-actions]"></ng-content>
        <button type="button" class="modal-close" (click)="close()" aria-label="Fechar">✕</button>
      </div>

      <div class="modal-body">
        <ng-content></ng-content>
      </div>

      @if (footerTemplate(); as footer) {
        <div class="modal-foot">
          <ng-container [ngTemplateOutlet]="footer"></ng-container>
        </div>
      }
    </div>
  </div>
}
